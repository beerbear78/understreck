name: Uppdatera Understreck

on:
  schedule:
    # GitHub räknar i UTC och startar ofta schemalagda körningar flera timmar för sent.
    # Därför startar lördagens körningar tidigt och VÄNTAR själva till rätt tid (--wait).
    # Fredag 17:00 UTC (19:00 sommartid, 18:00 vintertid): grundanalys.
    - cron: "0 17 * * 5"
    # Lördag 08, 10 och 12 UTC: startelvor. Den första som hinner väntar tills ~55 min före
    # första avspark; de andra är reserver och avslutas direkt om jobbet redan är gjort.
    - cron: "0 8 * * 6"
    - cron: "0 10 * * 6"
    - cron: "0 12 * * 6"
    # Lördag kväll och söndag morgon: rätt rad (preliminär) och officiell utdelning.
    - cron: "30 17 * * 6"
    - cron: "30 20 * * 6"
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Vad ska köras?"
        type: choice
        options: [friday, lineups, results, deploy]
        default: friday
      force:
        description: "Kör startelvor även utanför tidsfönstret"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/index.html", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: understreck
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: run
        name: Hämta data och räkna
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'claude-sonnet-5-5' }}
          RESEARCH: ${{ vars.RESEARCH || '1' }}
          RESEARCH_XG: ${{ vars.RESEARCH_XG || '0' }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE_INPUT: ${{ inputs.mode }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          MODE="$MODE_INPUT"
          WAIT=""
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "0 17 * * 5") MODE=friday ;;
              "0 8 * * 6"|"0 10 * * 6"|"0 12 * * 6") MODE=lineups; WAIT="--wait" ;;
              *) MODE=results; WAIT="--wait" ;;
            esac
          fi
          if [ "$EVENT" = "push" ]; then MODE=deploy; fi
          ARGS="--mode $MODE $WAIT"
          if [ "$FORCE_INPUT" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m understreck $ARGS
      - name: Spara data.js
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "understreck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js
          git diff --cached --quiet || (git commit -m "Uppdatera omgång" && git pull --rebase origin main && git push)

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
